name: Node checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['22']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: node --check server.mjs
      - run: node --check public/app.js
      - run: node --check public/chat-avatar.js
      - run: node --check public/knowledge-map.js
      - run: node --check core/bridges.mjs
      - run: node --check core/golem-cortex.mjs
      - run: node --check core/golem-data.mjs
      - run: node --check core/cloud-client.mjs
      - run: node --check core/store.mjs

      - run: node --check core/postgres.mjs
      - run: node --check core/golem-auto.mjs

      - run: node --check public/golem-immersive.js
      - run: node --check public/golem-fallback.js

      - run: node --check core/chat-memory.mjs
      - run: node --check public/golem-state.js
      - run: node --check scripts/check-dependencies.mjs
      - run: node --check public/ui.js
      - name: Install browser for interface checks
        if: runner.os == 'Linux'
        run: npx playwright install chromium --with-deps --only-shell
      - name: Check interface in Chromium
        if: runner.os == 'Linux'
        run: npm run test:ui
