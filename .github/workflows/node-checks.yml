name: Node checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ["22"]
    runs-on: ${{ matrix.os }}
    services:
      postgres:
        image: ${{ matrix.os == 'ubuntu-latest' && 'pgvector/pgvector:pg16' || '' }}
        env:
          POSTGRES_USER: amayori_test
          POSTGRES_PASSWORD: test_only
          POSTGRES_DB: amayori_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U amayori_test -d amayori_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
        env:
          AMAYORI_TEST_DATABASE_URL: ${{ runner.os == 'Linux' && 'postgresql://amayori_test:test_only@127.0.0.1:5432/amayori_test' || '' }}
      - run: npm run test:syntax
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Install browser for interface checks
        if: runner.os == 'Linux'
        run: npx playwright install chromium --with-deps --only-shell
      - name: Check interface in Chromium
        if: runner.os == 'Linux'
        run: npm run test:ui
