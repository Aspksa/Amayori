name: Node checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['22']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npm run test:syntax
      - name: Install browser for interface checks
        if: runner.os == 'Linux'
        run: npx playwright install chromium --with-deps --only-shell
      - name: Check interface in Chromium
        if: runner.os == 'Linux'
        run: npm run test:ui
