name: Import complete Project Golem source
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/import-golem.yml'
permissions:
  contents: write
jobs:
  import:
    if: github.repository == 'Aspksa/Amayori'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download full upstream tree
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/CyberMagician/Project_Golem.git /tmp/project-golem
          mkdir -p modules/project-golem
          rsync -a --delete --exclude='.git/' /tmp/project-golem/ modules/project-golem/
          git -C /tmp/project-golem rev-parse HEAD > modules/project-golem/.upstream-commit
          test -f modules/project-golem/.upstream-commit
          find modules/project-golem -type f | wc -l
      - name: Commit imported files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A modules/project-golem
          if git diff --cached --quiet; then echo 'Already up to date'; exit 0; fi
          git commit -m 'vendor: import full Project Golem upstream source'
          git push origin HEAD:main
